name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact-name: ai-memory-macos
            executable: AI Memory
          - os: windows-latest
            artifact-name: ai-memory-windows
            executable: AI Memory.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,desktop]"
      - run: pytest -q
      - name: Build app
        run: pyinstaller --name "AI Memory" --onefile --collect-all mcp src/aimemory/bootstrap.py
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.executable }}" "release/${{ matrix.artifact-name }}.zip"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path "dist/${{ matrix.executable }}" -DestinationPath "release/${{ matrix.artifact-name }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.zip
          generate_release_notes: true

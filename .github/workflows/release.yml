name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: ai-memory-macos
            executable: AI Memory.app
          - os: windows-latest
            artifact-name: ai-memory-windows
            executable: AI Memory.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev,desktop]"
      - run: npm ci
      - run: pytest -q
      - run: npm test
      - run: python scripts/fetch_rclone.py
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ai-memory-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          if ! security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -A \
            2>"$RUNNER_TEMP/developer-id-g2-import.log"; then
            if ! grep -q "already exists in the keychain" "$RUNNER_TEMP/developer-id-g2-import.log"; then
              cat "$RUNNER_TEMP/developer-id-g2-import.log" >&2
              exit 1
            fi
            echo "Developer ID G2 intermediate certificate is already installed."
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGNING_IDENTITY="Developer ID Application: Julia Denat ($APPLE_TEAM_ID)"
          pyinstaller --name "AI Memory" --onedir --windowed --codesign-identity "$SIGNING_IDENTITY" --collect-all mcp --collect-data aimemory --osx-bundle-identifier io.github.jujudnt.ai-memory src/aimemory/bootstrap.py
          pyinstaller --name ai-memory-cli --onefile --codesign-identity "$SIGNING_IDENTITY" --collect-all mcp --collect-data aimemory src/aimemory/bootstrap.py
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "dist/AI Memory.app/Contents/Info.plist"
          cp "dist/ai-memory-cli" "dist/AI Memory.app/Contents/MacOS/ai-memory-cli"
          cp vendor/rclone "dist/AI Memory.app/Contents/MacOS/rclone"
          cp vendor/rclone-COPYING.txt "dist/AI Memory.app/Contents/Resources/rclone-COPYING.txt"
          chmod +x "dist/AI Memory.app/Contents/MacOS/ai-memory-cli"
          SIGNING_IDENTITY="Developer ID Application: Julia Denat ($APPLE_TEAM_ID)"
          find "dist/AI Memory.app/Contents" -type f -print0 | while IFS= read -r -d '' item; do
            if file "$item" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$item"
            fi
          done
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "dist/AI Memory.app"
          codesign --verify --deep --strict --verbose=2 "dist/AI Memory.app"
          python scripts/smoke_packaged.py "dist/AI Memory.app/Contents/MacOS/ai-memory-cli"
      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --name ai-memory-cli --onefile --collect-all mcp --collect-data aimemory --add-binary "vendor/rclone.exe;." --add-data "vendor/rclone-COPYING.txt;." src/aimemory/bootstrap.py
          python scripts/smoke_packaged.py "dist/ai-memory-cli.exe"
          pyinstaller --name "AI Memory" --onefile --windowed --collect-all mcp --collect-all pystray --collect-data aimemory --add-binary "dist/ai-memory-cli.exe;." --add-binary "vendor/rclone.exe;." --add-data "vendor/rclone-COPYING.txt;." src/aimemory/bootstrap.py
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.executable }}" "release/${{ matrix.artifact-name }}.zip"
      - name: Notarize macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "release/${{ matrix.artifact-name }}.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple "dist/${{ matrix.executable }}"
          xcrun stapler validate "dist/${{ matrix.executable }}"
          spctl --assess --type execute --verbose=2 "dist/${{ matrix.executable }}"
          rm "release/${{ matrix.artifact-name }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.executable }}" "release/${{ matrix.artifact-name }}.zip"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path "dist/${{ matrix.executable }}" -DestinationPath "release/${{ matrix.artifact-name }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.zip
          generate_release_notes: true

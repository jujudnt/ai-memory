[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-memory"
version = "0.4.0"
description = "Local-first portable memory for AI coding assistant conversations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AI Memory contributors" }]
dependencies = ["filelock>=3.16", "zstandard>=0.23"]

[project.optional-dependencies]
zstd = ["zstandard>=0.23"]
watch = ["watchdog>=4"]
mcp = ["mcp>=1.12.4"]
dev = ["pytest>=8", "zstandard>=0.23", "mcp>=1.12.4"]
desktop = ["pyinstaller>=6.0", "mcp[cli]>=1.12.4", "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'"]

[project.scripts]
aimemory = "aimemory.cli:main"
aimemory-mcp = "aimemory.mcp.server:main"
aimemory-desktop = "aimemory.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aimemory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
